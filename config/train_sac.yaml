env:
  num_envs: 8
  max_episode_steps: 400

# Trainer 是这些超参的主定义方（字面值在此）；
# training / policy / buffers 等通过 ${trainer.xxx} 或 ${training.xxx} 引用，避免重复写值。
trainer:
  _target_: training.common.train_utils.OffPolicyTrainer
  seed: 42
  total_timesteps: 50000
  learning_starts: 1000
  batch_size: 64
  policy_updates: 1
  target_update_interval: 1
  eval_interval: 5000
  eval_episodes: 10
  final_eval_episodes: 30
  log_interval: 100
  is_save_model: true

training:
  seed: ${trainer.seed}     # set_seed 用
  eval_env_seed: 100000
  eval_num_envs: 8
  eval_seed: 200000
  buffer_size: 100000        # buffers.replay.capacity 用

policy:
  _target_: training.policy.sac_policy.SACPolicy
  hidden_dim: [256, 256]
  actor_grad_clip_norm: 1.0
  critic_grad_clip_norm: 5.0

  optimizer:
    actor:
      lr: 3e-4
      betas: [0.9, 0.999]
      eps: 1e-5
      weight_decay: 0.0
    critic:
      lr: 3e-4
      betas: [0.9, 0.999]
      eps: 1e-5
      weight_decay: 0.0
    alpha:
      lr: 3e-4
      betas: [0.9, 0.999]
      eps: 1e-5
      weight_decay: 0.0

  lr_scheduler:
    name: constant
    num_warmup_steps: 0

  gamma: 0.99
  tau: 0.005
  alpha: 1.0
  alpha_min: null
  target_entropy: null
  log_std_init: -3.0
  autotune: true
  use_sde: true

buffers:
  replay:
    _target_: training.common.buffer_utils.ReplayBuffer
    capacity: ${training.buffer_size}

name: sac

logging:
  project: sac_debug
  resume: false
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}
  tags: [sac]
  id: null
  group: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: logs/outputs/${name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
  sweep:
    dir: logs/outputs/${name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
    subdir: ${hydra.job.num}
