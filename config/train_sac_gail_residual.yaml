env:
  num_envs: 8
  max_episode_steps: 400

trainer:
  _target_: training.common.train_utils.ResidualGAILTrainer
  seed: 42
  total_timesteps: 2000000
  learning_starts: 5000     # 前 5000 步只用基座动作采集（基座预热），期间不做更新
  use_warmup: true          # 启用基座预热阶段；false 表示残差策略从第 0 步直接参与
  batch_size: 256
  policy_updates: 1
  target_update_interval: 1
  eval_interval: 10000
  eval_episodes: 30
  final_eval_episodes: 30
  log_interval: 100

  disc_updates: 2
  disc_batch_size: 64
  
  env_reward_weight: 0
  gail_reward_coef: 1.0
  success_reward: 100.0
  residual_scale: 0.1
  obs_horizon: ${base_policy.n_obs_steps}
  action_interval: ${base_policy.n_action_steps}
  sampling_steps: ${base_policy.num_inference_steps}
  gail_reward_scale: true
  is_save_model: true

training:
  seed: ${trainer.seed}      # set_seed 用
  eval_env_seed: 100000
  eval_num_envs: 8
  eval_seed: 200000
  buffer_size: 1000000       # buffers.replay.capacity 用
  generator_window: 50000    # buffers.generator.window_size 用

base_policy:
  _target_: training.policy.diffusion_policy.DiffusionPolicy
  horizon: 16
  obs_dim: 10
  action_dim: 6
  n_action_steps: 8
  n_obs_steps: 2
  num_inference_steps: 10
  warmstart_timestep: 50
  eta: 0.0

  # 基座已冻结，优化器与调度器仅满足构造签名，不参与训练。
  optimizer:
    lr: 3e-4
    betas: [0.9, 0.999]
    eps: 1e-5
    weight_decay: 1e-6

  lr_scheduler:
    name: cosine
    num_warmup_steps: 1000

  model:
    _target_: training.model.base.conditional_unet1d_sample.ConditionalUnet1D
    input_dim: ${base_policy.action_dim}
    global_cond_dim: ${eval:${base_policy.n_obs_steps} * ${base_policy.obs_dim}}
    diffusion_step_embed_dim: 256
    down_dims: [128, 256, 512]
    kernel_size: 5
    n_groups: 8
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon

policy:
  _target_: training.policy.sac_policy.ResidualSACPolicy
  hidden_dim: [256, 256]

  optimizer:
    actor:
      lr: 3e-4
      betas: [0.9, 0.999]
      eps: 1e-5
      weight_decay: 0.0
    critic:
      lr: 3e-4
      betas: [0.9, 0.999]
      eps: 1e-5
      weight_decay: 0.0
    alpha:
      lr: 1e-4
      betas: [0.9, 0.999]
      eps: 1e-5
      weight_decay: 0.0

  lr_scheduler:
    name: cosine
    num_warmup_steps: 0

  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  alpha_min: 0.02
  target_entropy: -6.0
  log_std_init: -3.0
  autotune: true
  use_sde: true

discriminator:
  _target_: training.policy.discriminator_policy.Discriminator
  hidden_dim: [64, 64]

  optimizer:
    lr: 1e-4
    betas: [0.9, 0.999]
    eps: 1e-5
    weight_decay: 0.01

  lr_scheduler:
    name: cosine
    num_warmup_steps: 20000

  smoothing: 0.05
  dropout: 0.1
  ent_reg_scale: 0.001
  grad_clip_norm: 5.0

buffers:
  expert:
    _target_: training.common.buffer_utils.ExpertDataManager
    capacity: ${training.buffer_size}
  replay:
    _target_: training.common.buffer_utils.ResidualReplayBuffer
    capacity: ${training.buffer_size}
  generator:
    _target_: training.common.buffer_utils.GenWindowView
    window_size: ${training.generator_window}

name: sac_gail_residual

logging:
  project: sac_gail_residual_debug
  resume: false
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}
  tags: [sac, gail, residual]
  id: null
  group: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: logs/outputs/${name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
  sweep:
    dir: logs/outputs/${name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
    subdir: ${hydra.job.num}
