- generic [active] [ref=f1e1]: "<?xml version='1.0' encoding='UTF-8'?> <feed xmlns:opensearch=\"http://a9.com/-/spec/opensearch/1.1/\" xmlns:arxiv=\"http://arxiv.org/schemas/atom\" xmlns=\"http://www.w3.org/2005/Atom\"> <id>https://arxiv.org/api/bs+DihaZnPg4rpOwvbHzer3TZGk</id> <title>arXiv Query: search_query=all:\"Discriminator Actor Critic\"&amp;id_list=&amp;start=0&amp;max_results=5</title> <updated>2026-09-29T07:11:18Z</updated> <link href=\"https://arxiv.org/api/query?search_query=all:%22Discriminator+Actor+Critic%22&amp;start=0&amp;max_results=5&amp;id_list=\" type=\"application/atom+xml\"/> <opensearch:itemsPerPage>5</opensearch:itemsPerPage> <opensearch:totalResults>4</opensearch:totalResults> <opensearch:startIndex>0</opensearch:startIndex> <entry> <id>http://arxiv.org/abs/1809.02925v2</id> <title>Discriminator-Actor-Critic: Addressing Sample Inefficiency and Reward Bias in Adversarial Imitation Learning</title> <updated>2018-10-15T17:27:25Z</updated> <link href=\"https://arxiv.org/abs/1809.02925v2\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/1809.02925v2\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>We identify two issues with the family of algorithms based on the Adversarial Imitation Learning framework. The first problem is implicit bias present in the reward functions used in these algorithms. While these biases might work well for some environments, they can also lead to sub-optimal behavior in others. Secondly, even though these algorithms can learn from few expert demonstrations, they require a prohibitively large number of interactions with the environment in order to imitate the expert for many real-world applications. In order to address these issues, we propose a new algorithm called Discriminator-Actor-Critic that uses off-policy Reinforcement Learning to reduce policy-environment interaction sample complexity by an average factor of 10. Furthermore, since our reward function is designed to be unbiased, we can apply our algorithm to many problems without making any task-specific adjustments.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"stat.ML\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2018-09-09T05:37:25Z</published> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Ilya Kostrikov</name> </author> <author> <name>Kumar Krishna Agrawal</name> </author> <author> <name>Debidatta Dwibedi</name> </author> <author> <name>Sergey Levine</name> </author> <author> <name>Jonathan Tompson</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2404.08513v1</id> <title>Adversarial Imitation Learning via Boosting</title> <updated>2024-04-12T14:53:36Z</updated> <link href=\"https://arxiv.org/abs/2404.08513v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2404.08513v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>Adversarial imitation learning (AIL) has stood out as a dominant framework across various imitation learning (IL) applications, with Discriminator Actor Critic (DAC) (Kostrikov et al.,, 2019) demonstrating the effectiveness of off-policy learning algorithms in improving sample efficiency and scalability to higher-dimensional observations. Despite DAC's empirical success, the original AIL objective is on-policy and DAC's ad-hoc application of off-policy training does not guarantee successful imitation (Kostrikov et al., 2019; 2020). Follow-up work such as ValueDICE (Kostrikov et al., 2020) tackles this issue by deriving a fully off-policy AIL objective. Instead in this work, we develop a novel and principled AIL algorithm via the framework of boosting. Like boosting, our new algorithm, AILBoost, maintains an ensemble of properly weighted weak learners (i.e., policies) and trains a discriminator that witnesses the maximum discrepancy between the distributions of the ensemble and the expert policy. We maintain a weighted replay buffer to represent the state-action distribution induced by the ensemble, allowing us to train discriminators using the entire data collected so far. In the weighted replay buffer, the contribution of the data from older policies are properly discounted with the weight computed based on the boosting framework. Empirically, we evaluate our algorithm on both controller state-based and pixel-based environments from the DeepMind Control Suite. AILBoost outperforms DAC on both types of environments, demonstrating the benefit of properly weighting replay buffer data for off-policy training. On state-based environments, DAC outperforms ValueDICE and IQ-Learn (Gary et al., 2021), achieving competitive performance with as little as one expert trajectory.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2024-04-12T14:53:36Z</published> <arxiv:comment>19 pages, 7 figures, 4 tables, 3 algorithms, ICLR 2024</arxiv:comment> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Jonathan D. Chang</name> </author> <author> <name>Dhruv Sreenivas</name> </author> <author> <name>Yingbing Huang</name> </author> <author> <name>Kianté Brantley</name> </author> <author> <name>Wen Sun</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2412.03959v2</id> <title>Is FISHER All You Need in The Multi-AUV Underwater Target Tracking Task?</title> <updated>2025-09-29T08:53:09Z</updated> <link href=\"https://arxiv.org/abs/2412.03959v2\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2412.03959v2\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>It is significant to employ multiple autonomous underwater vehicles (AUVs) to execute the underwater target tracking task collaboratively. However, it's pretty challenging to meet various prerequisites utilizing traditional control methods. Therefore, we propose an effective two-stage learning from demonstrations training framework, FISHER, to highlight the adaptability of reinforcement learning (RL) methods in the multi-AUV underwater target tracking task, while addressing its limitations such as extensive requirements for environmental interactions and the challenges in designing reward functions. The first stage utilizes imitation learning (IL) to realize policy improvement and generate offline datasets. To be specific, we introduce multi-agent discriminator-actor-critic based on improvements of the generative adversarial IL algorithm and multi-agent IL optimization objective derived from the Nash equilibrium condition. Then in the second stage, we develop multi-agent independent generalized decision transformer, which analyzes the latent representation to match the future states of high-quality samples rather than reward function, attaining further enhanced policies capable of handling various scenarios. Besides, we propose a simulation to simulation demonstration generation procedure to facilitate the generation of expert demonstrations in underwater environments, which capitalizes on traditional control methods and can easily accomplish the domain transfer to obtain demonstrations. Extensive simulation experiments from multiple scenarios showcase that FISHER possesses strong stability, multi-task performance and capability of generalization.</summary> <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"eess.SY\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2024-12-05T08:24:39Z</published> <arxiv:comment>This paper has been accepted by IEEE Transactions on Mobile Computing. Besides, Guanwen Xie and Jingzehua Xu contributed equally to this work</arxiv:comment> <arxiv:primary_category term=\"cs.RO\"/> <arxiv:journal_ref>IEEE Transactions on Mobile Computing 2025</arxiv:journal_ref> <author> <name>Guanwen Xie</name> </author> <author> <name>Jingzehua Xu</name> </author> <author> <name>Ziqi Zhang</name> </author> <author> <name>Xiangwang Hou</name> </author> <author> <name>Dongfang Ma</name> </author> <author> <name>Shuai Zhang</name> </author> <author> <name>Yong Ren</name> </author> <author> <name>Dusit Niyato</name> </author> <arxiv:doi>10.1109/TMC.2025.3607882</arxiv:doi> <link rel=\"related\" href=\"https://doi.org/10.1109/TMC.2025.3607882\" title=\"doi\"/> </entry> <entry> <id>http://arxiv.org/abs/2105.00822v2</id> <title>Generative Adversarial Reward Learning for Generalized Behavior Tendency Inference</title> <updated>2021-05-05T13:01:28Z</updated> <link href=\"https://arxiv.org/abs/2105.00822v2\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2105.00822v2\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>Recent advances in reinforcement learning have inspired increasing interest in learning user modeling adaptively through dynamic interactions, e.g., in reinforcement learning based recommender systems. Reward function is crucial for most of reinforcement learning applications as it can provide the guideline about the optimization. However, current reinforcement-learning-based methods rely on manually-defined reward functions, which cannot adapt to dynamic and noisy environments. Besides, they generally use task-specific reward functions that sacrifice generalization ability. We propose a generative inverse reinforcement learning for user behavioral preference modelling, to address the above issues. Instead of using predefined reward functions, our model can automatically learn the rewards from user's actions based on discriminative actor-critic network and Wasserstein GAN. Our model provides a general way of characterizing and explaining underlying behavioral tendencies, and our experiments show our method outperforms state-of-the-art methods in a variety of scenarios, namely traffic signal control, online recommender systems, and scanpath prediction.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.IR\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2021-05-03T13:14:25Z</published> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Xiaocong Chen</name> </author> <author> <name>Lina Yao</name> </author> <author> <name>Xianzhi Wang</name> </author> <author> <name>Aixin Sun</name> </author> <author> <name>Wenjie Zhang</name> </author> <author> <name>Quan Z. Sheng</name> </author> </entry> </feed>"