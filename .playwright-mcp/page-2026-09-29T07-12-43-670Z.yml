- generic [active] [ref=f3e1]: "<?xml version='1.0' encoding='UTF-8'?> <feed xmlns:opensearch=\"http://a9.com/-/spec/opensearch/1.1/\" xmlns:arxiv=\"http://arxiv.org/schemas/atom\" xmlns=\"http://www.w3.org/2005/Atom\"> <id>https://arxiv.org/api/hH3LE0G341t7Hby9J1KMNoxkfXc</id> <title>arXiv Query: search_query=all:\"ValueDICE\"&amp;id_list=&amp;start=0&amp;max_results=5</title> <updated>2026-09-29T07:12:43Z</updated> <link href=\"https://arxiv.org/api/query?search_query=all:%22ValueDICE%22&amp;start=0&amp;max_results=5&amp;id_list=\" type=\"application/atom+xml\"/> <opensearch:itemsPerPage>5</opensearch:itemsPerPage> <opensearch:totalResults>5</opensearch:totalResults> <opensearch:startIndex>0</opensearch:startIndex> <entry> <id>http://arxiv.org/abs/2202.02468v2</id> <title>Rethinking ValueDice: Does It Really Improve Performance?</title> <updated>2022-05-27T04:47:33Z</updated> <link href=\"https://arxiv.org/abs/2202.02468v2\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2202.02468v2\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>Since the introduction of GAIL, adversarial imitation learning (AIL) methods attract lots of research interests. Among these methods, ValueDice has achieved significant improvements: it beats the classical approach Behavioral Cloning (BC) under the offline setting, and it requires fewer interactions than GAIL under the online setting. Are these improvements benefited from more advanced algorithm designs? We answer this question by the following conclusions. First, we show that ValueDice could reduce to BC under the offline setting. Second, we verify that overfitting exists and regularization matters in the low-data regime. Specifically, we demonstrate that with weight decay, BC also nearly matches the expert performance as ValueDice does. The first two claims explain the superior offline performance of ValueDice. Third, we establish that ValueDice does not work when the expert trajectory is subsampled. Instead, the mentioned success of ValueDice holds when the expert trajectory is complete, in which ValueDice is closely related to BC that performs well as mentioned. Finally, we discuss the implications of our research for imitation learning studies beyond ValueDice.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2022-02-05T02:37:53Z</published> <arxiv:comment>This paper appeared at the blog track of the 10th international conference on learning representations (ICLR), 2022. Link: https://iclr-blog-track.github.io/2022/03/25/rethinking-valuedice/</arxiv:comment> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Ziniu Li</name> </author> <author> <name>Tian Xu</name> </author> <author> <name>Yang Yu</name> </author> <author> <name>Zhi-Quan Luo</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2106.03155v1</id> <title>SoftDICE for Imitation Learning: Rethinking Off-policy Distribution Matching</title> <updated>2021-06-06T15:37:11Z</updated> <link href=\"https://arxiv.org/abs/2106.03155v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2106.03155v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>We present SoftDICE, which achieves state-of-the-art performance for imitation learning. SoftDICE fixes several key problems in ValueDICE, an off-policy distribution matching approach for sample-efficient imitation learning. Specifically, the objective of ValueDICE contains logarithms and exponentials of expectations, for which the mini-batch gradient estimate is always biased. Second, ValueDICE regularizes the objective with replay buffer samples when expert demonstrations are limited in number, which however changes the original distribution matching problem. Third, the re-parametrization trick used to derive the off-policy objective relies on an implicit assumption that rarely holds in training. We leverage a novel formulation of distribution matching and consider an entropy-regularized off-policy objective, which yields a completely offline algorithm called SoftDICE. Our empirical results show that SoftDICE recovers the expert policy with only one demonstration trajectory and no further on-policy/off-policy samples. SoftDICE also stably outperforms ValueDICE and other baselines in terms of sample efficiency on Mujoco benchmark tasks.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2021-06-06T15:37:11Z</published> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Mingfei Sun</name> </author> <author> <name>Anuj Mahajan</name> </author> <author> <name>Katja Hofmann</name> </author> <author> <name>Shimon Whiteson</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2008.03525v1</id> <title>Non-Adversarial Imitation Learning and its Connections to Adversarial Methods</title> <updated>2020-08-08T13:43:06Z</updated> <link href=\"https://arxiv.org/abs/2008.03525v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2008.03525v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>Many modern methods for imitation learning and inverse reinforcement learning, such as GAIL or AIRL, are based on an adversarial formulation. These methods apply GANs to match the expert's distribution over states and actions with the implicit state-action distribution induced by the agent's policy. However, by framing imitation learning as a saddle point problem, adversarial methods can suffer from unstable optimization, and convergence can only be shown for small policy updates. We address these problems by proposing a framework for non-adversarial imitation learning. The resulting algorithms are similar to their adversarial counterparts and, thus, provide insights for adversarial imitation learning methods. Most notably, we show that AIRL is an instance of our non-adversarial formulation, which enables us to greatly simplify its derivations and obtain stronger convergence guarantees. We also show that our non-adversarial formulation can be used to derive novel algorithms by presenting a method for offline imitation learning that is inspired by the recent ValueDice algorithm, but does not rely on small policy updates for convergence. In our simulated robot experiments, our offline method for non-adversarial imitation learning seems to perform best when using many updates for policy and discriminator at each iteration and outperforms behavioral cloning and ValueDice.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.IT\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"stat.ML\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2020-08-08T13:43:06Z</published> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Oleg Arenz</name> </author> <author> <name>Gerhard Neumann</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2404.08513v1</id> <title>Adversarial Imitation Learning via Boosting</title> <updated>2024-04-12T14:53:36Z</updated> <link href=\"https://arxiv.org/abs/2404.08513v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2404.08513v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>Adversarial imitation learning (AIL) has stood out as a dominant framework across various imitation learning (IL) applications, with Discriminator Actor Critic (DAC) (Kostrikov et al.,, 2019) demonstrating the effectiveness of off-policy learning algorithms in improving sample efficiency and scalability to higher-dimensional observations. Despite DAC's empirical success, the original AIL objective is on-policy and DAC's ad-hoc application of off-policy training does not guarantee successful imitation (Kostrikov et al., 2019; 2020). Follow-up work such as ValueDICE (Kostrikov et al., 2020) tackles this issue by deriving a fully off-policy AIL objective. Instead in this work, we develop a novel and principled AIL algorithm via the framework of boosting. Like boosting, our new algorithm, AILBoost, maintains an ensemble of properly weighted weak learners (i.e., policies) and trains a discriminator that witnesses the maximum discrepancy between the distributions of the ensemble and the expert policy. We maintain a weighted replay buffer to represent the state-action distribution induced by the ensemble, allowing us to train discriminators using the entire data collected so far. In the weighted replay buffer, the contribution of the data from older policies are properly discounted with the weight computed based on the boosting framework. Empirically, we evaluate our algorithm on both controller state-based and pixel-based environments from the DeepMind Control Suite. AILBoost outperforms DAC on both types of environments, demonstrating the benefit of properly weighting replay buffer data for off-policy training. On state-based environments, DAC outperforms ValueDICE and IQ-Learn (Gary et al., 2021), achieving competitive performance with as little as one expert trajectory.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2024-04-12T14:53:36Z</published> <arxiv:comment>19 pages, 7 figures, 4 tables, 3 algorithms, ICLR 2024</arxiv:comment> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Jonathan D. Chang</name> </author> <author> <name>Dhruv Sreenivas</name> </author> <author> <name>Yingbing Huang</name> </author> <author> <name>Kianté Brantley</name> </author> <author> <name>Wen Sun</name> </author> </entry> <entry> <id>http://arxiv.org/abs/1912.05032v1</id> <title>Imitation Learning via Off-Policy Distribution Matching</title> <updated>2019-12-10T22:31:09Z</updated> <link href=\"https://arxiv.org/abs/1912.05032v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/1912.05032v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>When performing imitation learning from expert demonstrations, distribution matching is a popular approach, in which one alternates between estimating distribution ratios and then using these ratios as rewards in a standard reinforcement learning (RL) algorithm. Traditionally, estimation of the distribution ratio requires on-policy data, which has caused previous work to either be exorbitantly data-inefficient or alter the original objective in a manner that can drastically change its optimum. In this work, we show how the original distribution ratio estimation objective may be transformed in a principled manner to yield a completely off-policy objective. In addition to the data-efficiency that this provides, we are able to show that this objective also renders the use of a separate RL optimization unnecessary.Rather, an imitation policy may be learned directly from this objective without the use of explicit rewards. We call the resulting algorithm ValueDICE and evaluate it on a suite of popular imitation learning benchmarks, finding that it can achieve state-of-the-art sample efficiency and performance.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"stat.ML\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2019-12-10T22:31:09Z</published> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Ilya Kostrikov</name> </author> <author> <name>Ofir Nachum</name> </author> <author> <name>Jonathan Tompson</name> </author> </entry> </feed>"