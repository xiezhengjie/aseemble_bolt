- generic [active] [ref=f11e1]: "<?xml version='1.0' encoding='UTF-8'?> <feed xmlns:opensearch=\"http://a9.com/-/spec/opensearch/1.1/\" xmlns:arxiv=\"http://arxiv.org/schemas/atom\" xmlns=\"http://www.w3.org/2005/Atom\"> <id>https://arxiv.org/api/9y4+RJ30OkJrJlIwvjJzVSV8nkU</id> <title>arXiv Query: search_query=all:\"self-imitation\" AND all:\"GAIL\"&amp;id_list=&amp;start=0&amp;max_results=10</title> <updated>2026-09-29T07:15:56Z</updated> <link href=\"https://arxiv.org/api/query?search_query=all:%22self-imitation%22+AND+all:%22GAIL%22&amp;start=0&amp;max_results=10&amp;id_list=\" type=\"application/atom+xml\"/> <opensearch:itemsPerPage>10</opensearch:itemsPerPage> <opensearch:totalResults>1</opensearch:totalResults> <opensearch:startIndex>0</opensearch:startIndex> <entry> <id>http://arxiv.org/abs/1909.11468v1</id> <title>Independent Generative Adversarial Self-Imitation Learning in Cooperative Multiagent Systems</title> <updated>2019-09-25T13:11:33Z</updated> <link href=\"https://arxiv.org/abs/1909.11468v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/1909.11468v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>Many tasks in practice require the collaboration of multiple agents through reinforcement learning. In general, cooperative multiagent reinforcement learning algorithms can be classified into two paradigms: Joint Action Learners (JALs) and Independent Learners (ILs). In many practical applications, agents are unable to observe other agents' actions and rewards, making JALs inapplicable. In this work, we focus on independent learning paradigm in which each agent makes decisions based on its local observations only. However, learning is challenging in independent settings due to the local viewpoints of all agents, which perceive the world as a non-stationary environment due to the concurrently exploring teammates. In this paper, we propose a novel framework called Independent Generative Adversarial Self-Imitation Learning (IGASIL) to address the coordination problems in fully cooperative multiagent environments. To the best of our knowledge, we are the first to combine self-imitation learning with generative adversarial imitation learning (GAIL) and apply it to cooperative multiagent systems. Besides, we put forward a Sub-Curriculum Experience Replay mechanism to pick out the past beneficial experiences as much as possible and accelerate the self-imitation learning process. Evaluations conducted in the testbed of StarCraft unit micromanagement and a commonly adopted benchmark show that our IGASIL produces state-of-the-art results and even outperforms JALs in terms of both convergence speed and final performance.</summary> <category term=\"cs.MA\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2019-09-25T13:11:33Z</published> <arxiv:comment>accepted as a full paper by AAMAS 2019</arxiv:comment> <arxiv:primary_category term=\"cs.MA\"/> <author> <name>Xiaotian Hao</name> </author> <author> <name>Weixun Wang</name> </author> <author> <name>Jianye Hao</name> </author> <author> <name>Yaodong Yang</name> </author> </entry> </feed>"