            - text: (
            - link "Paszke et al. 2019" [ref=f9e2358] [cursor=pointer]:
              - /url: "#bib.bib45"
            - text: )
          - text: for all of our code.
        - paragraph [ref=f9e2360]:
          - text: "We group the IL algorithms and their variants into 6 key methods: AdRIL, DRIL, GAIL, GMMIL, PWIL, and RED. Our hyperparameter search spaces were determined based on hyperparameter ranges within the original works, a large subset of options tried by"
          - link "Orsini et al. 2021" [ref=f9e2362] [cursor=pointer]:
            - /url: "#bib.bib43"
          - text: ", and general hyperparameters such as learning rate and batch size, resulting in 7-18 hyperparameters to tune per algorithm. For each trajectory budget, we give each algorithm 30 hyperparameter evaluations using Bayesian optimisation"
          - generic [ref=f9e2363]:
            - text: (
            - link "Balandat et al. 2020" [ref=f9e2364] [cursor=pointer]:
              - /url: "#bib.bib5"
            - text: )
          - text: ", with the minimum of the cumulative reward for each of the 4 environments used as the optimisation objective, which can be seen as minimising regret over a set of environments. We then evaluate agents over 10 seeds with the best hyperparameters found, and report performance according to best practices"
          - generic [ref=f9e2365]:
            - text: (
            - link "Agarwal et al. 2021" [ref=f9e2366] [cursor=pointer]:
              - /url: "#bib.bib1"
            - text: )
          - text: . We therefore train 2880 agents for the final results, not including the extensive training and testing of agents performed while replicating and augmenting IL algorithms.
        - paragraph [ref=f9e2368]: DRIL, GAIL and RED include several options for their trained discriminators, including network hidden size, depth, activation function, dropout, and weight decay. The GAIL discriminator has additional options, detailed below.
