              - /url: "#bib.bib54"
            - text: ", alternating sampling expert and agent data batches vs. mixed batches,)"
          - text: ", and the discriminator update frequency"
          - math [ref=f9e2373]:
            - generic [ref=f9e2375]:
              - generic [ref=f9e2376]: ≥
              - generic [ref=f9e2377]: "1"
          - text: ", which determines the number of “rounds”. We also include “0” in the search space, which if chosen reverts to using the SQIL reward function."
        - paragraph [ref=f9e2379]:
          - text: DRIL options include the quantile cutoff
          - math [ref=f9e2380]:
            - generic [ref=f9e2382]:
              - generic [ref=f9e2383]: ∈
