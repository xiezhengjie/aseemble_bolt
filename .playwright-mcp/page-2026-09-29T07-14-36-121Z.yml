          - text: All IL algorithms use SAC
          - generic [ref=f9e2335]:
            - text: (
            - link "Haarnoja et al. 2018a" [ref=f9e2336] [cursor=pointer]:
              - /url: "#bib.bib23"
            - text: )
          - text: ", with automatic entropy tuning"
          - generic [ref=f9e2337]:
            - text: (
            - link "Haarnoja et al. 2018b" [ref=f9e2338] [cursor=pointer]:
              - /url: "#bib.bib24"
            - text: )
          - text: ", as the base RL agent, as theoretically required by SQIL and AdRIL, and as was empirically shown to be performant for adversarial IL algorithms"
          - generic [ref=f9e2339]:
            - text: (
            - link "Orsini et al. 2021" [ref=f9e2340] [cursor=pointer]:
              - /url: "#bib.bib43"
            - text: )
          - text: . The actor applies a tanh transformation to scale actions
          - math [ref=f9e2341]:
            - generic [ref=f9e2343]:
              - generic [ref=f9e2344]: ∈
              - generic [ref=f9e2345]:
                - generic [ref=f9e2346]: (
                - generic [ref=f9e2347]:
                  - generic [ref=f9e2348]: −
                  - generic [ref=f9e2349]: "1"
                - generic [ref=f9e2350]: ","
                - generic [ref=f9e2351]: "1"
                - generic [ref=f9e2352]: )
          - text: ", and dual critics are trained to reduce value overestimation"
          - generic [ref=f9e2353]:
            - text: (
            - link "Fujimoto et al. 2018" [ref=f9e2354] [cursor=pointer]:
              - /url: "#bib.bib19"
            - text: )
          - text: . We also include BC as a baseline, with the same actor architecture. All algorithms are optimised with AdamW
          - generic [ref=f9e2355]:
            - text: (
            - link "Loshchilov and Hutter 2019" [ref=f9e2356] [cursor=pointer]:
              - /url: "#bib.bib36"
            - text: )
