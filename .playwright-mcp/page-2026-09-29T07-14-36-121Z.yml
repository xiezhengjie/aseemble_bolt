  - article [ref=f9e4]:
    - heading "A Pragmatic Look at Deep Imitation Learning" [level=1] [ref=f9e5]
    - generic [ref=f9e6]:
      - generic [ref=f9e7]:
        - generic [ref=f9e8]: Kai Arulkumaran
        - link "kai_arulkumaran@araya.org" [ref=f9e12] [cursor=pointer]:
          - /url: mailto:kai_arulkumaran@araya.org
      - generic [ref=f9e13]:
        - generic [ref=f9e14]: Dan Ogawa Lillrank
        - generic [ref=f9e16]:
          - link "dan_ogawa@araya.org" [ref=f9e18] [cursor=pointer]:
            - /url: mailto:dan_ogawa@araya.org
          - generic [ref=f9e19]: Araya Inc., Tokyo, Japan
    - generic [ref=f9e20]:
      - heading "Abstract" [level=6] [ref=f9e21]
      - paragraph [ref=f9e22]: The introduction of the generative adversarial imitation learning (GAIL) algorithm has spurred the development of scalable imitation learning approaches using deep neural networks. Many of the algorithms that followed used a similar procedure, combining on-policy actor-critic algorithms with inverse reinforcement learning. More recently there have been an even larger breadth of approaches, most of which use off-policy algorithms. However, with the breadth of algorithms, everything from datasets to base reinforcement learning algorithms to evaluation settings can vary, making it difficult to fairly compare them. In this work we re-implement 6 different IL algorithms, updating 3 of them to be off-policy, base them on a common off-policy algorithm (SAC), and evaluate them on a widely-used expert trajectory dataset (D4RL) for the most common benchmark (MuJoCo). After giving all algorithms the same hyperparameter optimisation budget, we compare their results for a range of expert trajectories. In summary, GAIL, with all of its improvements, consistently performs well across a range of sample sizes, AdRIL is a simple contender that performs well with one important hyperparameter to tune, and behavioural cloning remains a strong baseline when data is more plentiful.
    - superscript [ref=f9e24]: †
    - superscript [ref=f9e26]: †
    - superscript [ref=f9e28]: †
    - generic [ref=f9e29]:
      - heading "keywords:" [level=6] [ref=f9e30]
      - text: imitation learning; inverse reinforcement learning; benchmarking
    - generic [ref=f9e31]:
      - heading "1 Introduction" [level=2] [ref=f9e32]:
        - generic [ref=f9e33]: "1"
        - text: Introduction
      - paragraph [ref=f9e35]:
        - text: Several years ago,
        - link "Henderson et al. 2018" [ref=f9e37] [cursor=pointer]:
          - /url: "#bib.bib25"
        - text: formally brought attention to the reproducibility crisis in deep reinforcement learning (DRL). Some solutions have been to settle on evaluation protocols for common benchmarks
        - generic [ref=f9e38]:
          - text: (
          - link "Machado et al. 2018" [ref=f9e39] [cursor=pointer]:
            - /url: "#bib.bib37"
          - text: )
        - text: ", improving the statistical tools with which we evaluate results"
        - generic [ref=f9e40]:
          - text: (
          - link "Agarwal et al. 2021" [ref=f9e41] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: )
        - text: ", or simply just providing reliable algorithm implementations"
        - generic [ref=f9e42]:
          - text: (
          - link "Raffin et al. 2021" [ref=f9e43] [cursor=pointer]:
            - /url: "#bib.bib48"
          - text: )
        - text: . Still, sometimes it is necessary to take a step back and evaluate the (claimed) progress within different areas of machine learning
        - generic [ref=f9e44]:
          - text: (
          - link "Oliver et al. 2018" [ref=f9e45] [cursor=pointer]:
            - /url: "#bib.bib42"
          - text: ;
          - link "Musgrave et al. 2020" [ref=f9e46] [cursor=pointer]:
            - /url: "#bib.bib39"
          - text: ", ML;)"
        - text: . In on-policy RL it has already been observed that implementation details can matter more than the algorithmic contributions of novel algorithms
        - generic [ref=f9e47]:
          - text: (
          - link "Engstrom et al. 2020" [ref=f9e48] [cursor=pointer]:
            - /url: "#bib.bib15"
          - text: ;
          - link "Andrychowicz et al. 2021" [ref=f9e49] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: )
        - text: ", and so in turn we have opted to take a"
        - emphasis [ref=f9e50]: pragmatic
        - text: look at (deep) imitation learning (IL), creating a single, open source codebase to fairly compare algorithms.
        - superscript [ref=f9e52]: "1"
      - paragraph [ref=f9e54]:
        - text: IL is the branch of ML that is concerned with learning from “demonstration” data
        - generic [ref=f9e55]:
          - text: (
          - link "Hussein et al. 2017" [ref=f9e56] [cursor=pointer]:
            - /url: "#bib.bib27"
          - text: )
        - text: . In other words, there exists agents, acting in environments, from which we collect data, in order to train our own agent. IL is intimately linked with RL—learning to act optimally in a given environment—and hence is often analysed with respect to concepts that are foundational to RL, such as states, actions, policies, reward functions, value functions, etc.
        - generic [ref=f9e57]:
          - text: (
          - link "Sutton and Barto 2018" [ref=f9e58] [cursor=pointer]:
            - /url: "#bib.bib53"
          - text: )
        - text: . Indeed, one of the most prominent approaches to IL is a technique known as inverse reinforcement learning
        - generic [ref=f9e59]:
          - text: (
          - link "Arora and Doshi 2021" [ref=f9e60] [cursor=pointer]:
            - /url: "#bib.bib3"
          - text: ", IRL;)"
        - text: .
      - paragraph [ref=f9e62]:
        - text: In the same way that deep learning (DL) has enabled RL to scale to high-dimensional state and action spaces
        - generic [ref=f9e63]:
          - text: (
          - link "Arulkumaran et al. 2017" [ref=f9e64] [cursor=pointer]:
            - /url: "#bib.bib4"
          - text: )
        - text: ", DL has also enabled IL to be applied to more complex domains. The most famous of these algorithms is generative adversarial IL"
        - generic [ref=f9e65]:
          - text: (
          - link "Ho and Ermon 2016" [ref=f9e66] [cursor=pointer]:
            - /url: "#bib.bib26"
          - text: ", GAIL;)"
        - text: ", which uses the generative adversarial framework"
        - generic [ref=f9e67]:
          - text: (
          - link "Goodfellow et al. 2014" [ref=f9e68] [cursor=pointer]:
            - /url: "#bib.bib21"
          - text: )
        - text: to learn a reward function which can then be used with IRL. In their work, they show strong results against a range of baselines, including the simplest IL method, behavioural cloning
        - generic [ref=f9e69]:
          - text: (
          - link "Pomerleau 1988" [ref=f9e70] [cursor=pointer]:
            - /url: "#bib.bib47"
          - text: ", BC;)"
        - text: . Although BC underperformed GAIL, they noted that it “was able to reach satisfactory performance with enough data”—a common observation. However, to “generate the datasets, … [they] subsampled the expert trajectories”. While this reduces the number of samples available, it is not the same as providing fewer trajectories without subsampling, as the former tends to result in better coverage of the state space.
        - emphasis [ref=f9e71]: Pragmatically
        - text: ", collecting trajectory data is a bottleneck for IL, so subsampling should be avoided---and in this case BC’s performance improves. IL results where trajectory data has been subsampled is not directly comparable to results where no subsampling has occurred, and unsurprisingly practitioners may miss critical details revealed in an appendix."
        - superscript [ref=f9e73]: "2"
      - paragraph [ref=f9e75]:
        - text: Another major issue in the reproducibility of IL algorithms is encountered in the GAIL paper—they generated their own expert trajectories using an RL agent. Out of the works that we review herein, nearly all generate their own expert data. And naturally, as time passes, the RL algorithms used within IL algorithms get replaced with more performant versions. One of the most significant of these changes is the move from on-policy RL algorithms, as used within the original work on GAIL, to more data-efficient off-policy algorithms
        - generic [ref=f9e76]:
          - text: (
          - link "Kostrikov et al. 2019" [ref=f9e77] [cursor=pointer]:
            - /url: "#bib.bib32"
          - text: ;
          - link "Blondé and Kalousis 2019" [ref=f9e78] [cursor=pointer]:
            - /url: "#bib.bib6"
          - text: )
        - text: . Do some of the on-policy IL algorithms that were competitive with GAIL
        - generic [ref=f9e79]:
          - text: (
          - link "Kim and Park 2018" [ref=f9e80] [cursor=pointer]:
            - /url: "#bib.bib31"
          - text: ;
          - link "Wang et al. 2019" [ref=f9e81] [cursor=pointer]:
            - /url: "#bib.bib58"
          - text: ;
          - link "Brantley et al. 2020" [ref=f9e82] [cursor=pointer]:
            - /url: "#bib.bib8"
          - text: )
        - text: still perform competitively when converted to be off-policy?
      - paragraph [ref=f9e84]:
        - text: "In this work, we review 6 different deep IL algorithms: GAIL"
        - generic [ref=f9e85]:
          - text: (
          - link "Ho and Ermon 2016" [ref=f9e86] [cursor=pointer]:
            - /url: "#bib.bib26"
          - text: )
        - text: ", generative moment matching imitation learning"
        - generic [ref=f9e87]:
          - text: (
          - link "Kim and Park 2018" [ref=f9e88] [cursor=pointer]:
            - /url: "#bib.bib31"
          - text: ", GMMIL;)"
        - text: ", random expert distillation"
        - generic [ref=f9e89]:
          - text: (
          - link "Wang et al. 2019" [ref=f9e90] [cursor=pointer]:
            - /url: "#bib.bib58"
          - text: ", RED;)"
        - text: ", disagreement-regularised imitation learning"
        - generic [ref=f9e91]:
          - text: (
          - link "Brantley et al. 2020" [ref=f9e92] [cursor=pointer]:
            - /url: "#bib.bib8"
          - text: ", DRIL;)"
        - text: ", adversarial reward-moment imitation learning"
        - generic [ref=f9e93]:
          - text: (
          - link "Swamy et al. 2021" [ref=f9e94] [cursor=pointer]:
            - /url: "#bib.bib54"
          - text: ", AdRIL;)"
        - text: ", and primal Wasserstein imitation learning"
        - generic [ref=f9e95]:
          - text: (
          - link "Dadashi et al. 2021" [ref=f9e96] [cursor=pointer]:
            - /url: "#bib.bib12"
          - text: ", PWIL;)"
        - text: . To minimise differences between them, we update GMMIL, RED, and DRIL to be off-policy, give them access to absorbing state indicators
        - generic [ref=f9e97]:
          - text: (
          - link "Kostrikov et al. 2019" [ref=f9e98] [cursor=pointer]:
            - /url: "#bib.bib32"
          - text: )
        - text: ", and use soft-actor critic"
        - generic [ref=f9e99]:
          - text: (
          - link "Haarnoja et al. 2018a" [ref=f9e100] [cursor=pointer]:
            - /url: "#bib.bib23"
          - text: ", SAC;)"
        - text: as the base RL algorithm for all methods. We then evaluate them on the standard MuJoCo continuous control benchmark environments
        - generic [ref=f9e101]:
          - text: (
          - link "Todorov et al. 2012" [ref=f9e102] [cursor=pointer]:
            - /url: "#bib.bib56"
          - text: ;
          - link "Brockman et al. 2016" [ref=f9e103] [cursor=pointer]:
            - /url: "#bib.bib9"
          - text: )
        - text: ", using the D4RL expert trajectory datasets"
        - generic [ref=f9e104]:
          - text: (
          - link "Fu et al. 2020" [ref=f9e105] [cursor=pointer]:
            - /url: "#bib.bib18"
          - text: )
        - text: for reproducibility. For a fairer comparison, we give each algorithm the same hyperparameter optimisation budget, and then run them with the best settings for several seeds, and report results using current best practices
        - generic [ref=f9e106]:
          - text: (
          - link "Agarwal et al. 2021" [ref=f9e107] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: )
        - text: . Given the many improvements to GAIL, as well as prior effort performing extensive hyperparameter tuning on adversarial IL methods
        - generic [ref=f9e108]:
          - text: (
          - link "Orsini et al. 2021" [ref=f9e109] [cursor=pointer]:
            - /url: "#bib.bib43"
          - text: )
        - text: ", unsurprisingly it remains one of the best IL algorithms to use. With more trajectories, AdRIL performs similarly to GAIL, whilst remaining simple to implement and tune (unlike GAIL). And, as observed many times before, BC becomes a competitive baseline with enough data."
