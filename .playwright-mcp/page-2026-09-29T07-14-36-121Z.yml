        - paragraph [ref=f9e1346]:
          - text: There are countless more advances within adversarial IL, making it difficult to know which techniques increase performance robustly.
          - link "Orsini et al. 2021" [ref=f9e1348] [cursor=pointer]:
            - /url: "#bib.bib43"
          - text: performed a large-scale hyperparameter search over many of these methods. The key takeaways were that off-policy RL algorithms help improve sample efficiency, discriminator regularisation is key, and that hyperparameter choices which are optimal for AI-generated trajectories are not always the same for human-generated trajectories—a valuable distinction that lies out of the scope of this work. Their work also shows the importance of large-scale empirical evaluation, as their results overturned theoretical claims about the importance of discriminator regularisation
