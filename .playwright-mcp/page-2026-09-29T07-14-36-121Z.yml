            - text: (
            - link "Brantley et al. 2020" [ref=f9e2392] [cursor=pointer]:
              - /url: "#bib.bib8"
            - text: )
          - text: ", we include an auxiliary BC loss during training. For simplicity we use the dropout ensemble. As using absorbing state indicators requires importance sampling, we adapt the BC loss used within DRIL to account for importance weights."
