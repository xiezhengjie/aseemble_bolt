        - paragraph [ref=f9e3002]:
          - text: Overall, GAIL performs robustly across all trajectory budgets, presumably due to the large amount of research that has gone into improving the performance and robustness of adversarial IL methods. However, AdRIL, which is practically much simpler (and faster), performs the same (with higher sample efficiency) with higher budgets, as near-expert data from the agent is less likely to overpower the effect of the expert data. This can also be seen in the hyperparameter optimisation, with the discriminator update frequency going from 0 (reverting to the SQIL reward function) to 12500 to 25000 as the trajectory budget increased. PWIL also performed well across budgets. Hyperparameter optimisation set the reward (
          - math [ref=f9e3003]:
            - generic [ref=f9e3004]: α
          - text: ) and reward bandwidth (
          - math [ref=f9e3006]:
            - generic [ref=f9e3007]: β
          - text: ) scales to 1 for 5 trajectories, but increased the values for these for 10 and 25 trajectories. However, we note that since each environment step requires computing the reward between the current state-action pair and a subset of the expert data, starting with the entire dataset at the start of each episode, it is computationally expensive for high budgets. BC scales well as the number of trajectories increase.
        - paragraph [ref=f9e3010]:
          - text: Unfortunately, we were unable to successfully optimise off-policy versions of DRIL, GMMIL and RED. In an early version of our codebase we were able to optimise their original, on-policy versions successfully, so with considerable effort put into hyperparameter tuning and trying additional regularisation strategies, we believe that their is some fundamental issue caused from going from training on on-policy to off-policy returns. One would expect that for successful training the inferred rewards for the agent’s trajectories should increase over time, but this was observed for runs of these methods as well, and is therefore not predictive of successful imitation. Q-values are a function of the predicted rewards, so did not provide further diagnostic insights. We also created variants of DRIL and RED in which the discriminators were trained online, similarly to GAIL, but were unsuccessful; however, there are many ways to do so, and our attempts do not preclude a successful online discriminator variant from being developed. Finally, we note that DRIL performs better at the start of training, which we can attribute to the BC auxiliary loss; experiments with uncertainty-only DRIL
          - generic [ref=f9e3011]:
            - text: (
            - link "Brantley et al. 2020" [ref=f9e3012] [cursor=pointer]:
              - /url: "#bib.bib8"
            - text: ", UO-DRIL;)"
          - text: did not show this trend, with scores remaining low during the entirety of training.
        - paragraph [ref=f9e3014]: Some weak trends we noticed from hyperparameter optimisation were that both batch and discriminator sizes increased with the trajectory budget. We hypothesise that the former is due to added stochasticity in optimisation aiding when data is scarce, whilst the latter is due to the need to prevent overfitting in low-data regimes. However, we caution that these trends do not always hold, as, for example, the optimal batch size for GAIL decreased with the trajectory budget.
    - generic [ref=f9e3015]:
      - heading "4 Discussion" [level=2] [ref=f9e3016]:
        - generic [ref=f9e3017]: "4"
        - text: Discussion
      - paragraph [ref=f9e3019]:
        - text: In this paper, we took a pragmatic look at deep IL methods, reviewing the relationships between the different approaches, updated older methods to use more data-efficient off-policy RL algorithms, and finally performed a fair comparison between them on a standard benchmark. As BC is simple and does not involve environment interaction, we recommend that it should always be considered as a baseline. AdRIL is an attractive option for deep IL due to its simplicity and strong performance, although it has one critical hyperparameter that needs tuning. And although the myriad of options for GAIL make it more complicated to work with, we have empirical data on what does and doesn’t work
        - generic [ref=f9e3020]:
          - text: (
          - link "Orsini et al. 2021" [ref=f9e3021] [cursor=pointer]:
            - /url: "#bib.bib43"
          - text: )
        - text: .
      - paragraph [ref=f9e3023]:
        - text: Although we were only able to test extensively on standard environments with expert data, we plan to release our framework to enable further, fair experiments on different environments, datasets, algorithms. Valuable open questions in the field of IL remain in the use of proxy reward functions for evaluating IL
        - generic [ref=f9e3024]:
          - text: (
          - link "Hussenot et al. 2021" [ref=f9e3025] [cursor=pointer]:
            - /url: "#bib.bib28"
          - text: )
        - text: ", and how best to learn from human demonstration data"
        - generic [ref=f9e3026]:
          - text: (
          - link "Orsini et al. 2021" [ref=f9e3027] [cursor=pointer]:
            - /url: "#bib.bib43"
          - text: )
        - text: .
