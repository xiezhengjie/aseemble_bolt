- generic [active] [ref=f8e1]: "<?xml version='1.0' encoding='UTF-8'?> <feed xmlns:opensearch=\"http://a9.com/-/spec/opensearch/1.1/\" xmlns:arxiv=\"http://arxiv.org/schemas/atom\" xmlns=\"http://www.w3.org/2005/Atom\"> <id>https://arxiv.org/api/mNUdyLGWMxvQjhNG/b5ok9kPod0</id> <title>arXiv Query: search_query=all:\"SAC\" AND all:\"GAIL\"&amp;id_list=&amp;start=0&amp;max_results=20</title> <updated>2026-09-29T07:13:59Z</updated> <link href=\"https://arxiv.org/api/query?search_query=all:%22SAC%22+AND+all:%22GAIL%22&amp;start=0&amp;max_results=20&amp;id_list=\" type=\"application/atom+xml\"/> <opensearch:itemsPerPage>20</opensearch:itemsPerPage> <opensearch:totalResults>3</opensearch:totalResults> <opensearch:startIndex>0</opensearch:startIndex> <entry> <id>http://arxiv.org/abs/2507.01161v1</id> <title>Imitation Learning for Satellite Attitude Control under Unknown Perturbations</title> <updated>2025-07-01T19:50:06Z</updated> <link href=\"https://arxiv.org/abs/2507.01161v1\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2507.01161v1\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>This paper presents a novel satellite attitude control framework that integrates Soft Actor-Critic (SAC) reinforcement learning with Generative Adversarial Imitation Learning (GAIL) to achieve robust performance under various unknown perturbations. Traditional control techniques often rely on precise system models and are sensitive to parameter uncertainties and external perturbations. To overcome these limitations, we first develop a SAC-based expert controller that demonstrates improved resilience against actuator failures, sensor noise, and attitude misalignments, outperforming our previous results in several challenging scenarios. We then use GAIL to train a learner policy that imitates the expert's trajectories, thereby reducing training costs and improving generalization through expert demonstrations. Preliminary experiments under single and combined perturbations show that the SAC expert can rotate the antenna to a specified direction and keep the antenna orientation reliably stable in most of the listed perturbations. Additionally, the GAIL learner can imitate most of the features from the trajectories generated by the SAC expert. Comparative evaluations and ablation studies confirm the effectiveness of the SAC algorithm and reward shaping. The integration of GAIL further reduces sample complexity and demonstrates promising imitation capabilities, paving the way for more intelligent and autonomous spacecraft control systems.</summary> <category term=\"eess.SY\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2025-07-01T19:50:06Z</published> <arxiv:comment>2025 AAS/AIAA Astrodynamics Specialist Conference</arxiv:comment> <arxiv:primary_category term=\"eess.SY\"/> <author> <name>Zhizhuo Zhang</name> </author> <author> <name>Hao Peng</name> </author> <author> <name>Xiaoli Bai</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2110.10149v2</id> <title>Continuous Control with Action Quantization from Demonstrations</title> <updated>2022-06-03T08:31:32Z</updated> <link href=\"https://arxiv.org/abs/2110.10149v2\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2110.10149v2\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>In this paper, we propose a novel Reinforcement Learning (RL) framework for problems with continuous action spaces: Action Quantization from Demonstrations (AQuaDem). The proposed approach consists in learning a discretization of continuous action spaces from human demonstrations. This discretization returns a set of plausible actions (in light of the demonstrations) for each input state, thus capturing the priors of the demonstrator and their multimodal behavior. By discretizing the action space, any discrete action deep RL technique can be readily applied to the continuous control problem. Experiments show that the proposed approach outperforms state-of-the-art methods such as SAC in the RL setup, and GAIL in the Imitation Learning setup. We provide a website with interactive videos: https://google-research.github.io/aquadem/ and make the code available: https://github.com/google-research/google-research/tree/master/aquadem.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2021-10-19T17:59:04Z</published> <arxiv:comment>Accepted to ICML 2022</arxiv:comment> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Robert Dadashi</name> </author> <author> <name>Léonard Hussenot</name> </author> <author> <name>Damien Vincent</name> </author> <author> <name>Sertan Girgin</name> </author> <author> <name>Anton Raichuk</name> </author> <author> <name>Matthieu Geist</name> </author> <author> <name>Olivier Pietquin</name> </author> </entry> <entry> <id>http://arxiv.org/abs/2108.01867v2</id> <title>A Pragmatic Look at Deep Imitation Learning</title> <updated>2023-09-20T01:44:06Z</updated> <link href=\"https://arxiv.org/abs/2108.01867v2\" rel=\"alternate\" type=\"text/html\"/> <link href=\"https://arxiv.org/pdf/2108.01867v2\" rel=\"related\" type=\"application/pdf\" title=\"pdf\"/> <summary>The introduction of the generative adversarial imitation learning (GAIL) algorithm has spurred the development of scalable imitation learning approaches using deep neural networks. Many of the algorithms that followed used a similar procedure, combining on-policy actor-critic algorithms with inverse reinforcement learning. More recently there have been an even larger breadth of approaches, most of which use off-policy algorithms. However, with the breadth of algorithms, everything from datasets to base reinforcement learning algorithms to evaluation settings can vary, making it difficult to fairly compare them. In this work we re-implement 6 different IL algorithms, updating 3 of them to be off-policy, base them on a common off-policy algorithm (SAC), and evaluate them on a widely-used expert trajectory dataset (D4RL) for the most common benchmark (MuJoCo). After giving all algorithms the same hyperparameter optimisation budget, we compare their results for a range of expert trajectories. In summary, GAIL, with all of its improvements, consistently performs well across a range of sample sizes, AdRIL is a simple contender that performs well with one important hyperparameter to tune, and behavioural cloning remains a strong baseline when data is more plentiful.</summary> <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"cs.NE\" scheme=\"http://arxiv.org/schemas/atom\"/> <category term=\"stat.ML\" scheme=\"http://arxiv.org/schemas/atom\"/> <published>2021-08-04T06:33:10Z</published> <arxiv:comment>Asian Conference on Machine Learning, 2023</arxiv:comment> <arxiv:primary_category term=\"cs.LG\"/> <author> <name>Kai Arulkumaran</name> </author> <author> <name>Dan Ogawa Lillrank</name> </author> </entry> </feed>"