          - text: ;
          - link "Ross et al. 2011" [ref=f2e87] [cursor=pointer]:
            - /url: "#bib.bib30"
          - text: )
        - text: and Inverse Reinforcement Learning (IRL)
        - generic [ref=f2e88]:
          - text: (
          - link "Ng & Russell 2000" [ref=f2e89] [cursor=pointer]:
            - /url: "#bib.bib24"
          - text: )
        - text: . To recover the underlying policy, IRL performs an intermediate step of estimating the reward function followed by RL on this function
        - generic [ref=f2e90]:
          - text: (
          - link "Abbeel & Ng 2004" [ref=f2e91] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: ;
          - link "Ratliff et al. 2006" [ref=f2e92] [cursor=pointer]:
            - /url: "#bib.bib28"
          - text: )
        - text: . Operating in the Maximum Entropy IRL formulation
        - generic [ref=f2e93]:
          - text: (
          - link "Ziebart et al. 2008" [ref=f2e94] [cursor=pointer]:
            - /url: "#bib.bib40"
          - text: )
        - text: ","
        - link "Finn et al. 2016b" [ref=f2e96] [cursor=pointer]:
          - /url: "#bib.bib8"
        - text: introduce an iterative-sampling based estimator for the partition function, deriving an algorithm for recovering non-linear reward functions in high-dimensional state and action spaces.
        - link "Finn et al. 2016a" [ref=f2e98] [cursor=pointer]:
          - /url: "#bib.bib7"
        - text: and
        - link "Fu et al. 2017" [ref=f2e100] [cursor=pointer]:
          - /url: "#bib.bib9"
        - text: further extend this by exploring the theory and practical considerations of an adversarial IRL framework, and draw connections between IRL and cost learning in GANs
        - generic [ref=f2e101]:
          - text: (
          - link "Goodfellow et al. 2014" [ref=f2e102] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: )
        - text: .
      - paragraph [ref=f2e104]:
        - text: In practical scenarios, we are often interested in recovering the expert’s policy, rather than the reward function. Following
        - link "Syed et al. 2008" [ref=f2e106] [cursor=pointer]:
          - /url: "#bib.bib34"
        - text: ", and by treating imitation learning as an occupancy matching problem,"
        - link "Ho & Ermon 2016" [ref=f2e108] [cursor=pointer]:
          - /url: "#bib.bib17"
        - text: proposed a Generative Adversarial Imitation Learning (GAIL) framework for learning a policy from demonstrations, which bypasses the need to recover the expert’s reward function. More recent work extends the framework by improving on stability and robustness
        - generic [ref=f2e109]:
          - text: (
          - link "Wang et al. 2017" [ref=f2e110] [cursor=pointer]:
            - /url: "#bib.bib38"
          - text: ;
          - link "Kim & Park 2018" [ref=f2e111] [cursor=pointer]:
            - /url: "#bib.bib19"
          - text: )
        - text: and making connections to model-based imitation learning
        - generic [ref=f2e112]:
          - text: (
          - link "Baram et al. 2017" [ref=f2e113] [cursor=pointer]:
            - /url: "#bib.bib5"
          - text: )
        - text: . These approaches generally use on-policy algorithms for policy optimization, trading off sample efficiency for training stability.
      - paragraph [ref=f2e115]:
        - text: Learning complex behaviors from sparse reward signals poses a significant challenge in reinforcement learning. In this context, expert demonstrations or template trajectories have been successfully used
        - generic [ref=f2e116]:
          - text: (
          - link "Peters & Schaal 2008" [ref=f2e117] [cursor=pointer]:
            - /url: "#bib.bib27"
          - text: )
        - text: for initalizing RL policies. There has been a growing interest in combining extrinsic sparse reward signals with imitation learning for guided exploration
        - generic [ref=f2e118]:
          - text: (
          - link "Zhu et al. 2018" [ref=f2e119] [cursor=pointer]:
            - /url: "#bib.bib39"
          - text: ;
          - link "Kang et al. 2018" [ref=f2e120] [cursor=pointer]:
            - /url: "#bib.bib18"
          - text: ;
          - link "Le et al. 2018" [ref=f2e121] [cursor=pointer]:
            - /url: "#bib.bib21"
          - text: ;
          - link "Vecerík et al. 2017" [ref=f2e122] [cursor=pointer]:
            - /url: "#bib.bib37"
          - text: )
        - text: . Off policy learning from demonstration has been previously studied under the umbrella of accelerating reinforcement learning by structured exploration
        - generic [ref=f2e123]:
          - text: (
          - link "Nair et al. 2017" [ref=f2e124] [cursor=pointer]:
            - /url: "#bib.bib23"
          - text: ;
          - link "Hester et al. 2017" [ref=f2e125] [cursor=pointer]:
            - /url: "#bib.bib16"
          - text: )
        - text: An implicit assumption of these approaches is access to demonstrations and reward from the environment; our approach requires access only to expert demonstrations.
      - paragraph [ref=f2e127]:
        - text: Our work is most related to AIL algorithms
        - generic [ref=f2e128]:
          - text: (
          - link "Ho & Ermon 2016" [ref=f2e129] [cursor=pointer]:
            - /url: "#bib.bib17"
          - text: ;
          - link "Fu et al. 2017" [ref=f2e130] [cursor=pointer]:
            - /url: "#bib.bib9"
          - text: ;
          - link "Torabi et al. 2018" [ref=f2e131] [cursor=pointer]:
            - /url: "#bib.bib36"
          - text: )
        - text: . In contrast to
        - link "Ho & Ermon 2016" [ref=f2e133] [cursor=pointer]:
          - /url: "#bib.bib17"
        - text: which assumes (state-action-state’) transition tuples,
        - link "Torabi et al. 2018" [ref=f2e135] [cursor=pointer]:
          - /url: "#bib.bib36"
        - text: has weaker assumptions, by relying only on observations and removing the dependency on actions. The contributions in this work are complementary (and compatible) to
        - link "Torabi et al. 2018" [ref=f2e137] [cursor=pointer]:
          - /url: "#bib.bib36"
        - text: .
