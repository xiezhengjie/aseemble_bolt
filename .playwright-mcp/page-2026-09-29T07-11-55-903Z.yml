        - generic [ref=f2e82]: "2"
        - text: Related Work
      - paragraph [ref=f2e84]:
        - text: Imitation learning has been broadly studied under the twin umbrellas of Behavioral Cloning (BC)
        - generic [ref=f2e85]:
          - text: (
          - link "Bain & Sommut 1999" [ref=f2e86] [cursor=pointer]:
