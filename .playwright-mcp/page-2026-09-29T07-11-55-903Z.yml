      - paragraph [ref=f2e2026]:
        - text: We replicate the experimental setup of
        - link "Ho & Ermon 2016" [ref=f2e2028] [cursor=pointer]:
          - /url: "#bib.bib17"
        - text: ": expert trajectories are sub-sampled by retaining every 20 time steps starting with a random offset (and fixed stride). It is worth mentioning that, as in"
        - link "Ho & Ermon 2016" [ref=f2e2030] [cursor=pointer]:
          - /url: "#bib.bib17"
        - text: ", this procedure is done in order to make the imitation learning task harder. With full trajectories, behavioral cloning provides competitive results to GAIL."
      - paragraph [ref=f2e2032]:
        - text: Following
        - link "Henderson et al. 2017" [ref=f2e2034] [cursor=pointer]:
          - /url: "#bib.bib15"
        - text: and
        - link "Fujimoto et al. 2018" [ref=f2e2036] [cursor=pointer]:
          - /url: "#bib.bib10"
        - text: ", we perform evaluation using 10 different random seeds. For each seed, we compute average episode reward using 10 episodes and running the policy without random noise. As in"
        - link "Ho & Ermon 2016" [ref=f2e2038] [cursor=pointer]:
          - /url: "#bib.bib17"
        - text: we plot reward normalized in such a way that zero corresponds to a random reward while one corresponds to expert rewards. We compute mean over all seeds and visualize half standard deviations. In order to produce the same evaluation for GAIL we used the original implementation
        - superscript [ref=f2e2040]: "2"
        - text: of the algorithm.
