    - generic [ref=f2e34]:
      - heading "Abstract" [level=6] [ref=f2e35]
      - paragraph [ref=f2e36]: We identify two issues with the family of algorithms based on the Adversarial Imitation Learning framework. The first problem is implicit bias present in the reward functions used in these algorithms. While these biases might work well for some environments, they can also lead to sub-optimal behavior in others. Secondly, even though these algorithms can learn from few expert demonstrations, they require a prohibitively large number of interactions with the environment in order to imitate the expert for many real-world applications. In order to address these issues, we propose a new algorithm called Discriminator-Actor-Critic that uses off-policy Reinforcement Learning to reduce policy-environment interaction sample complexity by an average factor of 10. Furthermore, since our reward function is designed to be unbiased, we can apply our algorithm to many problems without making any task-specific adjustments.
    - generic [ref=f2e37]:
      - heading "1 Introduction" [level=2] [ref=f2e38]:
        - generic [ref=f2e39]: "1"
        - text: Introduction
      - paragraph [ref=f2e41]:
        - text: The Adversarial Imitation Learning (AIL) class of algorithms learns a policy that robustly imitates an expert’s actions via a collection of expert demonstrations, an adversarial discriminator and a reinforcement learning method. For example, the Generative Adversarial Imitation Learning (GAIL) algorithm
        - generic [ref=f2e42]:
          - text: (
          - link "Ho & Ermon 2016" [ref=f2e43] [cursor=pointer]:
            - /url: "#bib.bib17"
          - text: )
        - text: uses a discriminator reward and a policy gradient algorithm to imitate an expert RL policy on standard benchmark tasks. Similarly, the Adversarial Inverse Reinforcement Learning (AIRL) algorithm
        - generic [ref=f2e44]:
          - text: (
          - link "Fu et al. 2017" [ref=f2e45] [cursor=pointer]:
            - /url: "#bib.bib9"
          - text: )
        - text: makes use of a modified GAIL discriminator to recover a reward function that can be used to perform Inverse Reinforcement Learning (IRL)
        - generic [ref=f2e46]:
          - text: (
          - link "Abbeel & Ng 2004" [ref=f2e47] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: )
        - text: and who‘s subsequent dense reward is robust to changes in dynamics or environment properties. Importantly, AIL algorithms such as GAIL and AIRL, obtain higher performance than supervised Behavioral Cloning (BC) when using a small number of expert demonstrations; experimentally suggesting that AIL algorithms alleviate some of the distributional drift
        - generic [ref=f2e48]:
          - text: (
          - link "Ross et al. 2011" [ref=f2e49] [cursor=pointer]:
            - /url: "#bib.bib30"
          - text: )
        - text: "issues associated with BC. However, both these AIL methods suffer from two important issues that will be addressed by this work: 1) a large number of policy interactions with the learning environment is required for policy convergence and 2) bias in the reward function formulation and improper handling of environment terminal states introduces implicit rewards priors that can either improve or degrade policy performance."
      - paragraph [ref=f2e51]:
        - text: While GAIL requires as little as 200 expert frame transitions (from 4 expert trajectories) to learn a robust reward function on most MuJoCo
        - generic [ref=f2e52]:
          - text: (
          - link "Todorov et al. 2012" [ref=f2e53] [cursor=pointer]:
            - /url: "#bib.bib35"
          - text: )
        - text: tasks, the number of policy frame transitions sampled from the environment can be as high as 25 million in order to reach convergence. If PPO
        - generic [ref=f2e54]:
          - text: (
          - link "Schulman et al. 2017" [ref=f2e55] [cursor=pointer]:
            - /url: "#bib.bib32"
          - text: )
        - text: is used in place of TRPO
        - generic [ref=f2e56]:
          - text: (
          - link "Schulman et al. 2015" [ref=f2e57] [cursor=pointer]:
            - /url: "#bib.bib31"
          - text: )
        - text: ", the sample complexity can be reduced somewhat (for example, as in Figure"
        - link "4" [ref=f2e58] [cursor=pointer]:
          - /url: "#S5.F4"
        - text: ", 25 million steps reduces to approximately 10 million steps), however it is still intractable for many robotics or real-world applications. In this work we address this issue by incorporating an off-policy RL algorithm (TD3"
        - generic [ref=f2e59]:
          - text: (
          - link "Fujimoto et al. 2018" [ref=f2e60] [cursor=pointer]:
            - /url: "#bib.bib10"
          - text: )
        - text: ) and an off-policy discriminator to dramatically decrease the sample complexity by many orders of magnitude.
      - paragraph [ref=f2e62]: In this work we will also illustrate how the specific form of AIL reward function used has a large impact on agent performance for episodic environments. For instance, as we will show, a strictly positive reward function prevents the agent from solving tasks in a minimal number of steps and a strictly negative reward function is not able to emulate a survival bonus. Therefore, one must have some knowledge of the true environment reward and incorporate such priors to choose a suitable reward function for successful application of GAIL and AIRL. We will discuss these issues in formal detail, and present a simple - yet effective - solution that drastically improves policy performance for episodic environments; we explicitly handle absorbing state transitions by learning the reward associated with these states.
      - paragraph [ref=f2e64]: "We propose a new algorithm, which we call Discriminator-Actor-Critic (DAC), that is compatible with both the popular GAIL and AIRL frameworks, incorporates explicit terminal state handling, an off-policy discriminator and an off-policy actor-critic reinforcement learning algorithm. DAC achieves state-of-the-art AIL performance for a number of difficult imitation learning tasks. More specifically, in this work we:"
      - list [ref=f2e66]:
        - listitem [ref=f2e67]:
          - text: •
          - paragraph [ref=f2e69]: Identify, and propose solutions for the problem of bias in discriminator-based reward estimation in imitation learning.
        - listitem [ref=f2e70]:
          - text: •
          - paragraph [ref=f2e72]: Accelerate learning from demonstrations by providing an off-policy variant for AIL algorithms, which significantly reduces the number of agent-environment interactions.
        - listitem [ref=f2e73]:
          - text: •
          - paragraph [ref=f2e75]: Illustrate the robustness of DAC to noisy, multi-modal and constrained expert demonstrations, by performing experiments with human demonstrations on non-trivial robotic tasks.
      - 'figure "Figure 1: The Discriminator-Actor-Critic imitation learning framework." [ref=f2e76]':
        - img "Refer to caption" [ref=f2e77]
        - generic [ref=f2e78]:
          - generic [ref=f2e79]: "Figure 1:"
          - text: The Discriminator-Actor-Critic imitation learning framework.
