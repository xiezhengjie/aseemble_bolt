    - generic [ref=f4e14]:
      - heading "Abstract" [level=6] [ref=f4e15]
      - paragraph [ref=f4e16]:
        - text: Adversarial imitation learning (AIL) has stood out as a dominant framework across various imitation learning (IL) applications, with Discriminator Actor Critic (DAC)
        - generic [ref=f4e17]:
          - text: (
          - link "Kostrikov et al. 2019" [ref=f4e18] [cursor=pointer]:
            - /url: "#bib.bib22"
          - text: )
        - text: demonstrating the effectiveness of off-policy learning algorithms in improving sample efficiency and scalability to higher-dimensional observations. Despite DAC’s empirical success, the original AIL objective is on-policy and DAC’s ad-hoc application of off-policy training does not guarantee successful imitation
        - generic [ref=f4e19]:
          - text: (
          - link "Kostrikov et al. 2019" [ref=f4e20] [cursor=pointer]:
            - /url: "#bib.bib22"
          - text: ;
          - link "Kostrikov et al. 2020" [ref=f4e21] [cursor=pointer]:
            - /url: "#bib.bib23"
          - text: )
        - text: . Follow-up work such as ValueDICE
        - generic [ref=f4e22]:
          - text: (
          - link "Kostrikov et al. 2020" [ref=f4e23] [cursor=pointer]:
            - /url: "#bib.bib23"
          - text: )
        - text: tackles this issue by deriving a fully off-policy AIL objective. Instead in this work, we develop a novel and principled AIL algorithm via the framework of
        - emphasis [ref=f4e24]: boosting
        - text: . Like boosting, our new algorithm, AILBoost, maintains an ensemble of
        - emphasis [ref=f4e25]: properly weighted
        - text: weak learners (i.e., policies) and trains a discriminator that witnesses the maximum discrepancy between the distributions of the ensemble and the expert policy. We maintain a weighted replay buffer to represent the state-action distribution induced by the ensemble, allowing us to train discriminators using the entire data collected so far. In the weighted replay buffer, the contribution of the data from older policies are properly discounted with the weight computed based on the boosting framework. Empirically, we evaluate our algorithm on both controller state-based and pixel-based environments from the DeepMind Control Suite. AILBoost outperforms DAC on both types of environments, demonstrating the benefit of properly weighting replay buffer data for off-policy training. On state-based environments, AILBoost outperforms ValueDICE and
        - generic [ref=f4e26]:
          - text: IQ-Learn
          - generic [ref=f4e27]:
            - text: (
            - link "Garg et al. 2021" [ref=f4e28] [cursor=pointer]:
              - /url: "#bib.bib12"
            - text: )
        - text: ", achieving competitive performance with as little as one expert trajectory."
    - generic [ref=f4e29]:
      - heading "1 Introduction" [level=2] [ref=f4e30]:
        - generic [ref=f4e31]: "1"
        - text: Introduction
      - paragraph [ref=f4e33]:
        - text: Imitation learning (IL) is a promising paradigm for learning general policies without rewards from demonstration data, achieving remarkable success in autonomous driving
        - generic [ref=f4e34]:
          - text: (
          - link "Bronstein et al. 2022" [ref=f4e35] [cursor=pointer]:
            - /url: "#bib.bib5"
          - text: ;
          - link "Pomerleau 1988" [ref=f4e36] [cursor=pointer]:
            - /url: "#bib.bib30"
          - text: )
        - text: ", video games"
        - generic [ref=f4e37]:
          - text: (
          - link "Baker et al. 2022" [ref=f4e38] [cursor=pointer]:
            - /url: "#bib.bib3"
          - text: ;
          - link "Shah et al. 2022" [ref=f4e39] [cursor=pointer]:
            - /url: "#bib.bib38"
          - text: )
        - text: and graphics
        - generic [ref=f4e40]:
          - text: (
          - link "Peng et al. 2021" [ref=f4e41] [cursor=pointer]:
            - /url: "#bib.bib29"
          - text: )
        - text: . Adversarial Imitation Learning (AIL) is an incredibly successful approach for imitation learning
        - generic [ref=f4e42]:
          - text: (
          - link "Ho & Ermon 2016" [ref=f4e43] [cursor=pointer]:
            - /url: "#bib.bib18"
          - text: ;
          - link "Fu et al. 2018" [ref=f4e44] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: ;
          - link "Kostrikov et al. 2019" [ref=f4e45] [cursor=pointer]:
            - /url: "#bib.bib22"
          - text: ;
          - link "Ke et al. 2020" [ref=f4e46] [cursor=pointer]:
            - /url: "#bib.bib20"
          - text: )
        - text: . These methods cast IL as a distribution matching problem whereby the learning agent minimizes the divergence between the expert demonstrator’s distribution and the state-action distribution induced by the agent. First introduced by
        - generic [ref=f4e47]:
          - text: (
          - link "Ho & Ermon 2016" [ref=f4e48] [cursor=pointer]:
            - /url: "#bib.bib18"
          - text: )
        - text: ", this divergence minimization can be achieved in an iterative procedure reminiscent of GAN algorithms"
        - generic [ref=f4e49]:
          - text: (
          - link "Goodfellow et al. 2014" [ref=f4e50] [cursor=pointer]:
            - /url: "#bib.bib13"
          - text: )
        - text: with our learned reward function and policy being the discriminator and generator respectively.
      - paragraph [ref=f4e52]:
        - text: Originally, a limitation of many AIL methods was that they were
        - emphasis [ref=f4e53]: on-policy
        - text: . That is, for on-policy AIL methods like GAIL
        - generic [ref=f4e54]:
          - text: (
          - link "Ho & Ermon 2016" [ref=f4e55] [cursor=pointer]:
            - /url: "#bib.bib18"
          - text: )
        - text: and AIRL
        - generic [ref=f4e56]:
          - text: (
          - link "Fu et al. 2018" [ref=f4e57] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: )
        - text: ", the algorithm would draw fresh samples from the current policy in every iteration for the distribution matching process while discarding all old samples, rendering the sample complexity of these algorithms to be prohibitively large in many applications. Follow-up works"
        - generic [ref=f4e58]:
          - text: (
          - link "Kostrikov et al. 2019" [ref=f4e59] [cursor=pointer]:
            - /url: "#bib.bib22"
          - text: ;
          - link "Sasaki et al. 2019" [ref=f4e60] [cursor=pointer]:
            - /url: "#bib.bib34"
          - text: )
        - text: attempt to relax the
        - emphasis [ref=f4e61]: on-policy
        - text: requirement by creating
        - emphasis [ref=f4e62]: off-policy
        - text: methods that utilize the entire history of observed data during the learning process. This history is often represented by a replay buffer and methods such as Discriminator Actor Critic (DAC) show large improvements in scalability and sample complexity over their on-policy counterparts. However, these methods modify the distribution matching objective as a divergence minimization between the replay buffer’s and the expert’s distribution, losing the guarantee of matching the expert’s behavior.
      - paragraph [ref=f4e64]:
        - text: Algorithms like ValueDICE
        - generic [ref=f4e65]:
          - text: (
          - link "Kostrikov et al. 2020" [ref=f4e66] [cursor=pointer]:
            - /url: "#bib.bib23"
          - text: )
        - text: address this problem by deriving a new formulation of the AIL divergence minimization objective to be entirely off-policy. ValueDICE, however, in principle relies on the environments to have deterministic dynamics.
        - superscript [ref=f4e68]: "1"
        - text: In this work, we consider a new perspective towards making AIL off-policy. We present a new principled off-policy AIL algorithm, AILBoost, via the gradient boosting framework
        - generic [ref=f4e69]:
          - text: (
          - link "Mason et al. 1999" [ref=f4e70] [cursor=pointer]:
            - /url: "#bib.bib25"
          - text: )
        - text: . AILBoost maintains an ensemble of properly weighted weak learners or policies as well as a weighted replay buffer to represent the state-action distribution induced by our ensemble. Our distribution matching objective is then to minimize the divergence between the weighted replay buffer’s distribution (i.e., the state-action distribution induced by the ensemble) and the expert demonstrator’s distribution, making the divergence minimization problem an off-policy learning problem. Similar to boosting and gradient boosting, at every iteration, we aim to find a weak learner, such that when added to the ensemble, the divergence between the updated ensemble’s distribution and the expert’s distribution decreases. In other words, our approach can be understood as performing gradient boosting in the state-action occupancy space, where black-box RL optimizer is used a weak learning procedure to train weak learners, i.e., policies.
      - paragraph [ref=f4e72]:
        - text: We evaluate AILBoost on the DeepMind Control Suite
        - generic [ref=f4e73]:
          - text: (
          - link "Tassa et al. 2018" [ref=f4e74] [cursor=pointer]:
            - /url: "#bib.bib42"
          - text: )
        - text: and compare against a range of off-policy AIL algorithms (Behavior cloning, ValueDICE, DAC) as well as a state-of-the-art IL algorithm, IQ-Learn. We show that our algorithm is comparable to or more sample efficient than state-of-the-art IL algorithms in various continuous control tasks, achieving strong imitation performance with as little as one expert demonstration. We also show that our approach scales to vision-based, partially observable domains, where we again outperform DAC.
    - generic [ref=f4e75]:
      - heading "2 Related works" [level=2] [ref=f4e76]:
        - generic [ref=f4e77]: "2"
        - text: Related works
      - generic [ref=f4e78]:
        - heading "Off-policy and Offline IL" [level=4] [ref=f4e79]
        - paragraph [ref=f4e81]:
          - text: There has also been a wide variety of research conducted on off-policy and offline IL, where the goal is to be either more sample efficient or safer by utilizing a replay buffer or not collecting any environmental transitions during training, respectively. The most prominent of said methods, and the closest to our work, is Discriminator-Actor-Critic (DAC)
          - generic [ref=f4e82]:
            - text: (
            - link "Kostrikov et al. 2019" [ref=f4e83] [cursor=pointer]:
              - /url: "#bib.bib22"
            - text: )
          - text: ", which essentially replaces the on-policy RL algorithm in the adversarial IL setup with an off-policy one such as DDPG"
          - generic [ref=f4e84]:
            - text: (
            - link "Lillicrap et al. 2019" [ref=f4e85] [cursor=pointer]:
              - /url: "#bib.bib24"
            - text: )
          - text: or SAC
          - generic [ref=f4e86]:
            - text: (
            - link "Haarnoja et al. 2018" [ref=f4e87] [cursor=pointer]:
              - /url: "#bib.bib15"
            - text: )
          - text: . However, as mentioned previously, DAC doesn’t necessarily guarantee a distribution match between the expert and the learned policy, prompting further work to be done. Further work has primarily focused on weighting on-policy and off-policy data differently in both the policy update and the discriminator update. ValueDICE
          - generic [ref=f4e88]:
            - text: (
            - link "Kostrikov et al. 2020" [ref=f4e89] [cursor=pointer]:
              - /url: "#bib.bib23"
            - text: )
          - text: mitigates this problem by deriving an objective from the original distribution matching problem that only requires off-policy samples to compute. More recently, methods such as IQ-Learn
          - generic [ref=f4e90]:
            - text: (
            - link "Garg et al. 2021" [ref=f4e91] [cursor=pointer]:
              - /url: "#bib.bib12"
            - text: )
          - text: have been developed to learn soft Q functions over the environment space, which encodes both a reward and a policy for inverse reinforcement learning, and model-based methods such as V-MAIL
          - generic [ref=f4e92]:
            - text: (
            - link "Rafailov et al. 2021" [ref=f4e93] [cursor=pointer]:
              - /url: "#bib.bib31"
            - text: )
          - text: have shown that using expressive world models
          - generic [ref=f4e94]:
            - text: (
            - link "Hafner et al. 2020" [ref=f4e95] [cursor=pointer]:
              - /url: "#bib.bib16"
            - text: )
          - text: leads to strong imitation results in domains with high-dimensional observations. Other off-policy IL works include SoftDICE
          - generic [ref=f4e96]:
            - text: (
            - link "Sun et al. 2021" [ref=f4e97] [cursor=pointer]:
              - /url: "#bib.bib39"
            - text: )
          - text: ", SparseDICE"
          - generic [ref=f4e98]:
            - text: (
            - link "Camacho et al. 2021" [ref=f4e99] [cursor=pointer]:
              - /url: "#bib.bib6"
            - text: )
          - text: ", and AdVIL/AdRIL/DAeQuIL"
          - generic [ref=f4e100]:
            - text: (
            - link "Swamy et al. 2021" [ref=f4e101] [cursor=pointer]:
              - /url: "#bib.bib41"
            - text: )
          - text: .
        - paragraph [ref=f4e103]:
          - text: Orthogonally, on the offline side, where environment interaction is prohibited, works both on the model-based side
          - generic [ref=f4e104]:
            - text: (
            - link "Chang et al. 2021" [ref=f4e105] [cursor=pointer]:
              - /url: "#bib.bib7"
            - text: )
          - text: and the model-free side
          - generic [ref=f4e106]:
            - text: (
            - link "Kim et al. 2022" [ref=f4e107] [cursor=pointer]:
              - /url: "#bib.bib21"
            - text: ;
            - link "Yu et al. 2023" [ref=f4e108] [cursor=pointer]:
              - /url: "#bib.bib47"
            - text: )
          - text: has shown that distribution matching is still possible in these settings. These approaches generally operate either by learning a transition model of the environment, with which to roll out in to do policy optimization
          - generic [ref=f4e109]:
            - text: (
            - link "Chang et al. 2021" [ref=f4e110] [cursor=pointer]:
              - /url: "#bib.bib7"
            - text: )
          - text: ", or optimizing a modified version of the objective introduced in"
          - generic [ref=f4e111]:
            - text: (
            - link "Kostrikov et al. 2020" [ref=f4e112] [cursor=pointer]:
              - /url: "#bib.bib23"
            - text: )
          - text: by using samples from the suboptimal offline dataset as opposed to on-policy samples for computation.
      - generic [ref=f4e113]:
        - heading "Boosting style approach in deep learning & RL" [level=4] [ref=f4e114]
        - paragraph [ref=f4e116]:
          - text: The idea of using boosting for policy learning is not new in the deep learning or reinforcement learning literature. On the deep learning side, AdaGAN
          - generic [ref=f4e117]:
            - text: (
            - link "Tolstikhin et al. 2017" [ref=f4e118] [cursor=pointer]:
              - /url: "#bib.bib44"
            - text: )
          - text: apply standard adaptive boosting to GANs
          - generic [ref=f4e119]:
