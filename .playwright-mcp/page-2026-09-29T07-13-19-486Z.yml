    - generic [ref=f4e2808]:
      - heading "6 Conclusion" [level=2] [ref=f4e2809]:
        - generic [ref=f4e2810]: "6"
        - text: Conclusion
      - paragraph [ref=f4e2812]: In this work, we present a fully off-policy adversarial imitation learning algorithm, AILBoost. Different from previous attempts at making AIL off-policy, via the gradient boosting framework, AILBoost provides a principled way of re-using old data for learning discriminators and policies. We show that our algorithm achieves state-of-the-art performance on state-based results on the DeepMind Control Suite while being able to scale to high-dimensional, pixel observations. We are excited to extend this framework to discrete control as well as investigate imitation learning from observations alone under this boosting framework.
