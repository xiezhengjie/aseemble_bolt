        - heading "5.2 Image-based Experiments" [level=3] [ref=f4e2762]:
          - generic [ref=f4e2763]: "5.2"
          - text: Image-based Experiments
        - paragraph [ref=f4e2765]:
          - link "Figure 3" [ref=f4e2766] [cursor=pointer]:
            - /url: "#S5.F3"
          - text: demonstrates the scalability of AILBoost on a subset of environments with 10 expert trajectories. For these experiments, we use DrQ-v2
          - generic [ref=f4e2767]:
            - text: (
            - link "Yarats et al. 2022" [ref=f4e2768] [cursor=pointer]:
              - /url: "#bib.bib46"
            - text: )
          - text: as the underlying off-policy RL algorithm for both DAC and AILBoost. On Walker Walk and Cheetah Run, we see comparable to better performance than DAC demonstrating that our boosting strategy successfully maintains the empirical, scaling properties of DAC. Furthermore, our use of different off-policy RL algorithms show the versatility of AILBoost for IL.
      - generic [ref=f4e2769]:
        - heading "5.3 Sensitivity to gradient-based optimization for weak learners and discriminators" [level=3] [ref=f4e2770]:
          - generic [ref=f4e2771]: "5.3"
          - text: Sensitivity to gradient-based optimization for weak learners and discriminators
        - paragraph [ref=f4e2773]:
          - text: Our algorithm relies on solving optimization problems in Eq.
          - link "6" [ref=f4e2774] [cursor=pointer]:
            - /url: "#S4.E6"
          - text: and Eq.
          - link "5" [ref=f4e2775] [cursor=pointer]:
            - /url: "#S4.E5"
          - text: for weak learners and discriminators, where weak learner is optimized by SAC and discriminators are optimized by SGD. While it is hard to guarantee in general that we can exactly solve the optimization problem due to our policies and discriminators are both being non-convex neural networks, we in general found that approximately solving Eq.
          - link "6" [ref=f4e2776] [cursor=pointer]:
            - /url: "#S4.E6"
          - text: and Eq.
          - link "5" [ref=f4e2777] [cursor=pointer]:
            - /url: "#S4.E5"
          - text: via gradient based update is enough to ensure good performance. In this section, we test AILBoost across a variety of optimization schedules. Overall, we find that AILBoost to be robust to optimization schedules — approximately optimizing Eq.
          - link "6" [ref=f4e2778] [cursor=pointer]:
            - /url: "#S4.E6"
          - text: and Eq.
          - link "5" [ref=f4e2779] [cursor=pointer]:
            - /url: "#S4.E5"
          - text: with sufficient amount of gradient updates ensures successful imitation; however, there exists a sample complexity cost when over-optimizing either the discriminator or the policy.
        - generic [ref=f4e2780]:
          - paragraph [ref=f4e2781]:
            - link "Figure 4" [ref=f4e2782] [cursor=pointer]:
              - /url: "#S5.F4"
            - text: "shows our investigation of how sensitive AILBoost is to different optimization schedules for both the policy and discriminator on two representative DMC environments. In particular, we test with 5 expert demonstrations, where we vary the number of discriminator and policy updates. We test the following update schemes:"
          - list [ref=f4e2783]:
            - listitem [ref=f4e2784]:
              - text: •
              - paragraph [ref=f4e2786]: 1000 policy updates per 100 discriminator updates
            - listitem [ref=f4e2787]:
              - text: •
              - paragraph [ref=f4e2789]: 1000 policy updates per 10 discriminator updates
            - listitem [ref=f4e2790]:
              - text: •
              - paragraph [ref=f4e2792]: 1000 policy updates per 1 discriminator update
            - listitem [ref=f4e2793]:
              - text: •
              - paragraph [ref=f4e2795]: 100 policy updates per 100 discriminator updates
        - paragraph [ref=f4e2797]:
          - text: These ranges, test various optimization schemes around the schedule that we chose for the main results. We find that the more policy updates we do per discriminator update, the algorithm becomes significantly less sample efficient despite asymptotically reaching expert performance. We also found that an insufficient amount of updates on the discriminator general hurts the performance. This is also expected since insufficient update on the discriminators may result a
