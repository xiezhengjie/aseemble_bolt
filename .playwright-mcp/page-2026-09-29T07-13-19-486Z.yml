            - link "Goodfellow et al. 2014" [ref=f4e120] [cursor=pointer]:
              - /url: "#bib.bib13"
            - text: )
          - text: to address and fix issues such as mode collapse, while concurrent work
          - generic [ref=f4e121]:
            - text: (
            - link "Grover & Ermon 2017" [ref=f4e122] [cursor=pointer]:
              - /url: "#bib.bib14"
            - text: )
          - text: showed benefits of boosting in general Bayesian mixture models. In RL, the conservative policy iteration (CPI)
          - generic [ref=f4e123]:
            - text: (
            - link "Kakade & Langford 2002" [ref=f4e124] [cursor=pointer]:
              - /url: "#bib.bib19"
            - text: )
          - text: can be understood as performing gradient boosting in the policy space
          - generic [ref=f4e125]:
            - text: (
            - link "Scherrer & Geist 2014" [ref=f4e126] [cursor=pointer]:
              - /url: "#bib.bib35"
            - text: )
          - text: . The authors in
          - generic [ref=f4e127]:
            - text: (
            - link "Hazan et al. 2019" [ref=f4e128] [cursor=pointer]:
              - /url: "#bib.bib17"
            - text: )
          - text: use a gradient boosting style approach to learn maximum entropy policies. In this work, we perform gradient boosting in the space of state-action occupancy measures, which leads to a principled off-policy IL approach.
